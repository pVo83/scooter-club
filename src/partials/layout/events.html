<section class="events">
  <div class="container">
    <!--  -->
    <div class="events__content section-left">
      <h3 class="events__title _anim-items _anim-no-hide">Эксклюзивный доступ к событиям Самокатов</h3>
      <p class="events__desc _anim-items _anim-no-hide">С абонементом — у вас доступ к специальным мероприятиям,
        скидки и классный мерч.
        В 2023 году мы танцевали на летней вечеринке с Антохой MC, катались на самокатах с Сергеем Мезенцевым и слушали хор
        Attaque de Panique</p>
    </div>
    <!--  -->
    <ul class="moments">
      <li class="moments__item">
        <picture class="moments__picture moments__picture--one _anim-items _anim-no-hide">
          <source srcset="img/events-img/events1.webp" type="image/webp">
          <img class="moments__img" loading="lazy" src="img/events-img/events1.png" width="456" height="456"
            alt="игра на трубе">
        </picture>
      </li>
      <li class="moments__item">
        <picture class="moments__picture moments__picture--two _anim-items _anim-no-hide">
          <source srcset="img/events-img/events2.webp" type="image/webp">
          <img class="moments__img" loading="lazy" src="img/events-img/events2.png" width="456" height="456"
            alt="дискотека">
        </picture>
      </li>
      <li class="moments__item">
        <picture class="moments__picture moments__picture--free _anim-items _anim-no-hide">
          <source srcset="img/events-img/events3.webp" type="image/webp">
          <img class="moments__img" loading="lazy" src="img/events-img/events3.png" width="456" height="456"
            alt="покупки">
        </picture>
      </li>
      <li class="moments__item">
        <picture class="moments__picture moments__picture--four _anim-items _anim-no-hide">
          <source srcset="img/events-img/events4.webp" type="image/webp">
          <img class="moments__img" loading="lazy" src="img/events-img/events4.png" width="456" height="456"
            alt="улыбающаяся девушка">
        </picture>
      </li>
    </ul>
    <!--  -->
    <div class="momentsSlider-wrapper _anim-items _anim-no-hide">
      <!-- Swiper -->
      <div class="swiper momentsSlider">
        <div class="swiper-wrapper">
          <!--  -->
          <div class="swiper-slide">
            <div class="slide">
              <picture class="slide__picture">
                <source srcset="img/events-img/events1.webp" type="image/webp">
                <img class="slide__img" loading="lazy" src="img/events-img/events1.png" width="344" height="344"
                  alt="Музыкант играет на трубе">
              </picture>
            </div>
          </div>

          <div class="swiper-slide">
            <div class="slide">
              <picture class="slide__picture">
                <source srcset="img/events-img/events2.webp" type="image/webp">
                <img class="slide__img" loading="lazy" src="img/events-img/events2.png" width="344" height="344"
                  alt="Гости на дискотеке">
              </picture>
            </div>
          </div>

          <div class="swiper-slide">
            <div class="slide">
              <picture class="slide__picture">
                <source srcset="img/events-img/events3.webp" type="image/webp">
                <img class="slide__img" loading="lazy" src="img/events-img/events3.png" width="344" height="344"
                  alt="Покупки на мероприятии">
              </picture>
            </div>
          </div>

          <div class="swiper-slide">
            <div class="slide">
              <picture class="slide__picture">
                <source srcset="img/events-img/events4.webp" type="image/webp">
                <img class="slide__img" loading="lazy" src="img/events-img/events4.png" width="344" height="344"
                  alt="Улыбающаяся девушка на событии">
              </picture>
            </div>
          </div>
          <!--  -->
        </div>
      </div>
      <div class="moments-btn">
        <button class="moments-btn-prev btn-reset" type="button" aria-label="Предыдущий слайд">
          <svg class="arrow-left" width="27" height="25" aria-hidden="true">
            <use xlink:href="img/svg/sprite.svg#arrow-left"></use>
          </svg>
        </button>
        <button class="moments-btn-next btn-reset" type="button" aria-label="Следующий слайд">
          <svg class="arrow-right" width="27" height="25" aria-hidden="true">
            <use xlink:href="img/svg/sprite.svg#arrow-right"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
