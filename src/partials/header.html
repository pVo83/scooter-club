<header class="header">
  <div class="container header__container">
    <!--  -->
    <div class="header__content section-left">
      <div class="logo _anim-items _anim-no-hide" aria-label="Логотип Scooter Club">
        <svg class="logo__icon" width="240" height="47" aria-hidden="true">
          <use xlink:href="img/svg/sprite.svg#logo"></use>
        </svg>
      </div>
      <h1 class="header__title _anim-items _anim-no-hide">Вступайте в клуб Самокатов</h1>
      <p class="header__desc _anim-items _anim-no-hide">Купите абонемент, чтобы стать частью клуба в новом сезоне–2024. 8 месяцев за 
        <span class="price">
          <span class="price__new">499₽</span>
          <span class="price__old">3190₽</span>
        </span>
      </p>
      <div class="btn-wrap">
        <a class="btn header__btn _anim-items _anim-no-hide" href="#demo-cta" aria-label="Демо-кнопка: стать частью клуба">Стать частью клуба</a>
      </div>
    </div>
    <!--  -->
    <div class="header__images _anim-items _anim-no-hide">
      <picture class="header__picture">
        <source srcset="img/hero-img.webp" type="image/webp">
        <img class="header__img" fetchpriority="high" src="img/hero-img.png" width="744" height="618" alt="Электросамокат">
      </picture>
    </div>
    <!--  -->
  </div>
</header>
